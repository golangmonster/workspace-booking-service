syntax = "proto3";

package workspace_booking_service.api.booking.v1;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "buf/validate/validate.proto";

option go_package = "github.com/golangmonster/workspace-booking-service/pkg/api/booking/v1";

service BookingService {
  rpc CreateBooking(CreateBookingRequest) returns (CreateBookingResponse) {
    option (google.api.http) = {
      post: "/api/booking/v1/bookings"
      body: "*"
    };
  }

  rpc CancelBooking(CancelBookingRequest) returns (CancelBookingResponse) {
    option (google.api.http) = {
      post: "/api/booking/v1/bookings/{id}/cancel"
      body: "*"
    };
  }

  rpc CompleteBooking(CompleteBookingRequest) returns (CompleteBookingResponse) {
    option (google.api.http) = {
      post: "/api/booking/v1/bookings/{id}/complete"
      body: "*"
    };
  }

  rpc ListBookings(ListBookingsRequest) returns (ListBookingsResponse) {
    option (google.api.http) = {
      post: "/api/booking/v1/list-bookings"
      body: "*"
    };
  }
}

enum BookingStatus {
  BOOKING_STATUS_UNSPECIFIED = 0;
  BOOKING_STATUS_ACTIVE = 1;
  BOOKING_STATUS_CANCELLED = 2;
  BOOKING_STATUS_COMPLETED = 3;
}

message Booking {
  int64 id = 1;

  int64 workspace_id = 2;
  int64 user_id = 3;

  google.protobuf.Timestamp start_at = 4;
  google.protobuf.Timestamp end_at = 5;

  BookingStatus status = 6;

  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message Page {
  uint64 limit = 1 [
    (buf.validate.field).uint64.gt = 0,
    (buf.validate.field).uint64.lt = 1000
  ];

  uint64 offset = 2;
}

message GetBookingByIDRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetBookingByIDResponse {
  Booking booking = 1;
}

message CreateBookingRequest {
  int64 workspace_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 user_id = 2 [(buf.validate.field).int64.gt = 0];
  google.protobuf.Timestamp start_at = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp end_at = 4 [(buf.validate.field).required = true];
}

message CreateBookingResponse {
  int64 booking_id = 1;
}

message CancelBookingRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message CancelBookingResponse {}

message CompleteBookingRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message CompleteBookingResponse {}

message ListBookingsRequest {
  Page page = 1 [(buf.validate.field).required = true];

  optional Filter filter = 2;

  message Filter {
    optional int64 user_id = 1;

    optional int64 workspace_id = 2;

    repeated BookingStatus statuses = 3 [
      (buf.validate.field).repeated.items.enum.defined_only = true
    ];

    // date_from/date_to are truncated to a date on the server and matched
    // against bookings whose [start_at, end_at) interval overlaps that
    // [date_from, date_to] range of days.
    optional google.protobuf.Timestamp date_from = 4;

    optional google.protobuf.Timestamp date_to = 5;
  }
}

message ListBookingsResponse {
  repeated Booking bookings = 1;

  uint32 total_count = 2;
}

