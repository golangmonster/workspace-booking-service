syntax = "proto3";

package workspace_booking_service.api.kafka.v1;

import "api/model/v1/model.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/golangmonster/workspace-booking-service/pkg/api/kafka/v1";

message WorkspaceBooking {
  int64 booking_id = 1;
  model.v1.BookingStatus status = 2;
  int64 workspace_id = 3;
  int64 user_id = 4;
  google.protobuf.Timestamp start_at = 5;
  google.protobuf.Timestamp end_at = 6;
}