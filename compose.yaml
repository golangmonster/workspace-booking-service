services:
  controller:
    image: confluentinc/cp-kafka:7.6.1
    hostname: controller
    container_name: controller
    environment:
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_NODE_ID: 1
      # На каком сокете слушает:
      KAFKA_LISTENERS: "CONTROLLER://controller:29092"
      # Участники кворума при определении лидера:
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller:29092"
      # По какому префиксу искать первого слушателя при KRaft:
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  broker:
    image: confluentinc/cp-kafka:7.6.1
    hostname: broker
    container_name: broker
    env_file:
      - .env
    ports:
      - "9095:9092"       # Внутренний порт 9092 для общения внутри Docker
      - "9091:29092"      # Изменено: Внешний порт 9091 хоста -> 29092 контейнера
      - "9104:9101"       # JMX
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: "broker"
      # Префикс слушателя у контроллера:
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Префикс слушателя для внутреннего общения брокеров:
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Изменено: broker-1 слушает на 29092 для внешнего соединения
      KAFKA_LISTENERS: "PLAINTEXT://broker:9092,PLAINTEXT_HOST://0.0.0.0:29092"
      # Пары префикс слушателя - протокол безопасности:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      # Изменено: Адрес, по которому внешние клиенты будут подключаться с хоста
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker:9092,PLAINTEXT_HOST://localhost:9091"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller:29092"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init-topics
    env_file:
      - .env
    depends_on:
      - broker
    entrypoint: [ "sh", "-c" ]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      cub kafka-ready -b broker:9092 1 30

      echo 'Creating Kafka topics...'
      kafka-topics --create --if-not-exists --bootstrap-server broker:9092 --partitions 1 --replication-factor 1 --topic ${KAFKA_WORKSPACE_BOOKING_TOPIC}

      echo 'All topics created successfully!'
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"  # Интерфейс будет доступен на http://localhost:8080
    depends_on:
      - broker
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "local-cluster"
      # Подключаемся по внутреннему имени сервиса и порту
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker:9092"

  db:
    container_name: workspace-booking-postgres
    image: postgres:15
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_volume:/var/lib/postgresql/data
    networks:
      - workspace_booking_network

volumes:
  db_volume:
    
networks:
  workspace_booking_network: